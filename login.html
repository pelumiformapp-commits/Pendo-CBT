<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PĒÑDØ Academy - Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f9ff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:350px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#0056b3;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    background:#0056b3;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#003d80;
}

p{
    text-align:center;
    margin-top:15px;
}

a{
    color:#0056b3;
    text-decoration:none;
}
</style>

</head>
<body>

<div class="container">

<h1>PĒÑDØ Academy</h1>

<form id="loginForm">
    <input type="email" id="email" placeholder="Email Address" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Login</button>
</form>

<p>Don't have an account? 
    <a href="register.html">Register</a>
</p>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value;

    // 1. Check for Admin Hardcoded Credentials
    if (email === "admin@pendo.com" && password === "123456") {
        alert("Admin Login Successful!");
        
        // Save Admin Session Data
        let adminSession = { name: "Administrator", role: "admin", email: email };
        localStorage.setItem("pendoUser", JSON.stringify(adminSession));
        
        window.location.href = "admin.html"; // Routes to the admin question creator panel
        return;
    }

    // 2. Fetch and Check Registered Student Accounts from localStorage
    let registeredUsers = JSON.parse(localStorage.getItem("pendoUsers")) || [];
    
    // Find matching user profile array values
    let matchedUser = registeredUsers.find(user => user.email === email && user.password === password);

    if (matchedUser) {
        alert(`Welcome back, ${matchedUser.name}!`);
        
        // Save Active Student Session Data for dashboard use
        let studentSession = { name: matchedUser.name, role: "student", email: matchedUser.email };
        localStorage.setItem("pendoUser", JSON.stringify(studentSession));
        
        window.location.href = "dashboard.html"; // Routes to the student exam options list
    } else {
        alert("Invalid Email or Password. Please try again.");
    }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PĒÑDØ Academy - Welcome</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
body{ background:#f4f9ff; display:flex; justify-content:center; align-items:center; height:100vh; text-align: center; padding: 20px; }
.container{ max-width:500px; background:#fff; padding:40px; border-radius:10px; box-shadow:0 0 15px rgba(0,0,0,.2); }
h1{ color:#0056b3; margin-bottom:15px; font-size: 32px; }
p{ color: #555; margin-bottom: 25px; line-height: 1.6; }
button{ background:#0056b3; color:white; border:none; padding:14px 28px; border-radius:5px; cursor:pointer; font-size:18px; font-weight: bold; width: 100%; transition: background 0.2s; }
button:hover{ background:#003d80; }
</style>
</head>
<body>

<div class="container">
    <h1>Welcome to PĒÑDØ Academy</h1>
    <p>Your premier Computer-Based Testing (CBT) portal for computer science examination and real-time skill evaluation assessments.</p>
    <button onclick="routeUser()">Enter Portal</button>
</div>

<script>
function routeUser() {
    // Check if a session already exists to avoid re-login friction
    const session = JSON.parse(localStorage.getItem("pendoUser"));

    if (session) {
        if (session.role === "admin") {
            window.location.href = "admin.html";
        } else {
            window.location.href = "dashboard.html";
        }
    } else {
        // No session found, send to login screen
        window.location.href = "login.html";
    }
}

// Auto-run routing engine immediately on background load
window.onload = routeUser;
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PĒÑDØ Academy Admin Panel</title>
<style>
body{ font-family:Arial,sans-serif; background:#f4f9ff; margin:0; }
header{ background:#0056b3; color:white; padding:20px; text-align:center; }
.container{ max-width:900px; margin:30px auto; background:white; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,.2); }
input, select{ width:100%; padding:10px; margin:10px 0; box-sizing: border-box; }
button{ background:#0056b3; color:white; padding:12px 20px; border:none; border-radius:5px; cursor:pointer; width: 100%; font-weight: bold; margin-bottom: 10px; }
button:hover{ background:#003d80; }
.question{ padding:15px; border-bottom:1px solid #ddd; background: #f9f9f9; margin-bottom: 10px; border-left: 5px solid #0056b3; position: relative; }
.action-buttons { margin-top: 10px; display: flex; gap: 10px; }
.action-buttons button { width: auto; padding: 6px 12px; font-size: 13px; margin-bottom: 0; }
.danger-btn { background: #dc3545; }
.danger-btn:hover { background: #b02a37; }
.success-btn { background: #28a745; }
.success-btn:hover { background: #218838; }
.warning-btn { background: #ffc107; color: #000; }
.warning-btn:hover { background: #e0a800; }
</style>
</head>
<body>

<header>
<h1>PĒÑDØ Academy Admin Panel</h1>
</header>

<div class="container">
<h2 id="formTitle">Add New Question</h2>

<label><strong>Select Course:</strong></label>
<select id="courseCode">
  <option value="CPE101">CPE 101 - Introduction to Computing</option>
  <option value="CPE201">CPE 201 - Programming Fundamentals</option>
  <option value="CPE302">CPE 302 - Object Oriented Programming</option>
</select>

<!-- Form fields are completely clear and editable -->
<input type="text" id="question" placeholder="Type your question statement here...">
<input type="text" id="option1" placeholder="Type Option A here...">
<input type="text" id="option2" placeholder="Type Option B here...">
<input type="text" id="option3" placeholder="Type Option C here...">
<input type="text" id="option4" placeholder="Type Option D here...">

<label><strong>Correct Answer:</strong></label>
<select id="answer">
  <option value="0">Option A</option>
  <option value="1">Option B</option>
  <option value="2">Option C</option>
  <option value="3">Option D</option>
</select>

<button id="submitBtn" onclick="saveQuestion()">Save Question</button>
<button id="cancelEditBtn" class="danger-btn" onclick="cancelEdit()" style="display: none;">Cancel Edit</button>

<hr style="margin: 30px 0;">
<h2>All Saved Questions</h2>
<div id="list"></div>
<br>

<button class="success-btn" onclick="window.location.href='admin_scores.html'">View Global Student Scores & Gradebook</button>
<button class="danger-btn" onclick="logout()">Logout to Login Screen</button>
</div>

<script>
// 1. Verify Admin Session Authorization Gate
const userSession = JSON.parse(localStorage.getItem("pendoUser"));
if (!userSession || userSession.role !== "admin") {
    alert("Access Denied: Administrative privileges required.");
    window.location.href = "login.html";
}

// 2. Fetch or initialize our course-grouped database structure
let database = JSON.parse(localStorage.getItem("pendo_quiz_db")) || { "CPE101": [], "CPE201": [], "CPE302": [] };

// Track edit state parameters
let editMode = false;
let editCourse = "";
let editIndex = null;

function saveQuestion(){
    let course = document.getElementById("courseCode").value;
    let qText = document.getElementById("question").value.trim();
    let opt1 = document.getElementById("option1").value.trim();
    let opt2 = document.getElementById("option2").value.trim();
    let opt3 = document.getElementById("option3").value.trim();
    let opt4 = document.getElementById("option4").value.trim();
    let ansVal = Number(document.getElementById("answer").value);

    if(!qText || !opt1 || !opt2 || !opt3 || !opt4) {
        alert("Please fill in all text fields.");
        return;
    }

    let questionData = {
        question: qText,
        options: [opt1, opt2, opt3, opt4],
        answer: ansVal
    };

    if (editMode) {
        // Remove from old course index if it changed during edit configuration
        if (editCourse !== course) {
            database[editCourse].splice(editIndex, 1);
            database[course].push(questionData);
        } else {
            // Update targeted question inline index
            database[course][editIndex] = questionData;
        }
        alert("Question updated successfully!");
        cancelEdit();
    } else {
        database[course].push(questionData);
        alert("Question saved to " + course);
    }

    localStorage.setItem("pendo_quiz_db", JSON.stringify(database));
    clearForm();
    displayQuestions();
}

function editQuestion(course, index) {
    editMode = true;
    editCourse = course;
    editIndex = index;

    let targetQ = database[course][index];

    // Explicit array targeting allows text to safely write back out to inputs
    document.getElementById("courseCode").value = course;
    document.getElementById("question").value = targetQ.question;
    document.getElementById("option1").value = targetQ.options[0];
    document.getElementById("option2").value = targetQ.options[1];
    document.getElementById("option3").value = targetQ.options[2];
    document.getElementById("option4").value = targetQ.options[3];
    document.getElementById("answer").value = targetQ.answer;

    document.getElementById("formTitle").innerText = "Edit Question";
    document.getElementById("submitBtn").innerText = "Update Question";
    document.getElementById("cancelEditBtn").style.display = "block";
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit() {
    editMode = false;
    editCourse = "";
    editIndex = null;
    
    document.getElementById("formTitle").innerText = "Add New Question";
    document.getElementById("submitBtn").innerText = "Save Question";
    document.getElementById("cancelEditBtn").style.display = "none";
    clearForm();
}

function deleteQuestion(course, index) {
    if (confirm("Are you sure you want to delete this question? This step cannot be reversed.")) {
        database[course].splice(index, 1);
        localStorage.setItem("pendo_quiz_db", JSON.stringify(database));
        if (editMode && editCourse === course && editIndex === index) {
            cancelEdit();
        }
        displayQuestions();
    }
}

function clearForm() {
    document.getElementById("question").value = "";
    document.getElementById("option1").value = "";
    document.getElementById("option2").value = "";
    document.getElementById("option3").value = "";
    document.getElementById("option4").value = "";
    document.getElementById("answer").value = "0";
}

function displayQuestions(){
    let output = "";
    let courses = ["CPE101", "CPE201", "CPE302"];
    
    courses.forEach(c => {
        output += `<h3 style="margin-top:20px; color:#0056b3;">${c} Questions</h3>`;
        if(!database[c] || database[c].length === 0) {
            output += "<p style='color:gray;'>No questions added yet.</p>";
        } else {
            database[c].forEach((q, i) => {
                output += `
                <div class="question">
                    <b>${i+1}. ${q.question}</b><br>
                    A. ${q.options[0]} ${q.answer === 0 ? '✔️' : ''}<br>
                    B. ${q.options[1]} ${q.answer === 1 ? '✔️' : ''}<br>
                    C. ${q.options[2]} ${q.answer === 2 ? '✔️' : ''}<br>
                    D. ${q.options[3]} ${q.answer === 3 ? '✔️' : ''}
                    
                    <div class="action-buttons">
                        <button class="warning-btn" onclick="editQuestion('${c}', ${i})">Edit</button>
                        <button class="danger-btn" onclick="deleteQuestion('${c}', ${i})">Delete</button>
                    </div>
                </div>`;
            });
        }
    });
    document.getElementById("list").innerHTML = output;
}

function logout() {
    localStorage.removeItem("pendoUser");
    window.location.href = "login.html";
}

// Initial display execution context render pass
displayQuestions();
</script>
</body>
  </html>

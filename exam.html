<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PĒÑDØ Academy - Exam</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
body{ background:#f4f9ff; }
header{ background:#0056b3; color:white; padding:15px; display:flex; justify-content:space-between; align-items:center; }
.container{ max-width:800px; margin:20px auto; padding:20px; }
.card{ background:white; padding:25px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,.15); margin-bottom:20px; }
.question-num{ color:#0056b3; font-weight:bold; }
.timer{ color:#dc3545; font-weight:bold; font-size:18px; }
.options label{ display:block; background:#f8f9fa; padding:12px; margin:8px 0; border-radius:5px; cursor:pointer; border:2px solid #ddd; }
.options input[type="radio"]{ margin-right:10px; }
.options label:hover{ background:#e2efff; border-color:#0056b3; }
button{ background:#0056b3; color:white; padding:14px 25px; border:none; border-radius:5px; cursor:pointer; font-size:16px; font-weight:bold; width:100%; margin-top:15px; }
button:hover{ background:#003d80; }
.login-box{ text-align:center; }
.login-box input{ width:100%; padding:12px; margin:10px 0; border:1px solid #ccc; border-radius:5px; }
</style>
</head>
<body>

<header>
<div class="question-num" id="qNum">Question 1/1</div>
<div class="timer" id="timer">Time Left: 30:00</div>
</header>

<div class="container">
<div id="loginCard" class="card login-box">
    <h2>Welcome to PĒÑDØ CBT</h2>
    <p>Enter your details to start</p>
    <input type="text" id="studentName" placeholder="Enter Full Name">
    <input type="text" id="studentEmail" placeholder="Enter Phone/Email">
    <button onclick="startStudentSession()">Start Exam</button>
</div>

<div id="examCard" class="card" style="display:none;">
    <h3 id="questionText"></h3>
    <div class="options" id="optionsList"></div>
    <button onclick="nextQuestion()">Next Question</button>
</div>

<div id="resultCard" class="card" style="display:none; text-align:center;">
    <h2>Exam Submitted!</h2>
    <h3 id="finalScore"></h3>
    <button onclick="window.location.href='index.html'">Go Home</button>
</div>
</div>

<script>
let questions = [];
let currentQ = 0;
let score = 0;
let answers = [];
let timerInterval;
let timeLeft = 30 * 60; // 30 minutes
let studentInfo = {};
let subject = new URLSearchParams(window.location.search).get('subject') || 'General';

function startStudentSession(){
    let name = document.getElementById("studentName").value.trim();
    let email = document.getElementById("studentEmail").value.trim();
    if(!name ||!email){ alert("Please enter name and email"); return; }

    studentInfo = {name, email};
    document.getElementById("loginCard").style.display = "none";
    document.getElementById("examCard").style.display = "block";

    loadQuestions();
    startTimer();
}

function loadQuestions(){
    let allQuestions = JSON.parse(localStorage.getItem("pendo_global_exam")) || [];
    questions = allQuestions.filter(q => q.subject === subject);

    if(questions.length === 0){
        alert("No questions found for " + subject);
        window.location.href = "index.html";
        return;
    }
    showQuestion();
}

function showQuestion(){
    if(currentQ >= questions.length){ submitExam(); return; }

    let q = questions[currentQ];
    document.getElementById("qNum").innerText = `Question ${currentQ+1}/${questions.length}`;
    document.getElementById("questionText").innerText = q.question;

    let optionsHTML = "";
    q.options.forEach((opt, i) => {
        optionsHTML += `<label><input type="radio" name="answer" value="${i}"> ${String.fromCharCode(65+i)}. ${opt}</label>`;
    });
    document.getElementById("optionsList").innerHTML = optionsHTML;
}

function nextQuestion(){
    let selected = document.querySelector('input[name="answer"]:checked');
    if(!selected){ alert("Please select an answer"); return; }

    if(Number(selected.value) === questions[currentQ].answer){ score++; }
    currentQ++;
    showQuestion();
}

function startTimer(){
    timerInterval = setInterval(() => {
        timeLeft--;
        let min = Math.floor(timeLeft/60);
        let sec = timeLeft%60;
        document.getElementById("timer").innerText = `Time Left: ${min}:${sec < 10? '0' : ''}${sec}`;
        if(timeLeft <= 0){ clearInterval(timerInterval); submitExam(); }
    }, 1000);
}

function submitExam(){
    clearInterval(timerInterval);
    document.getElementById("examCard").style.display = "none";
    document.getElementById("resultCard").style.display = "block";
    document.getElementById("finalScore").innerText = `Your Score: ${score}/${questions.length}`;

    // Save to gradebook
    let allScores = JSON.parse(localStorage.getItem("pendo_scores")) || [];
    allScores.push({
        studentName: studentInfo.name,
        studentEmail: studentInfo.email,
        subject: subject,
        score: `${score}/${questions.length}`,
        date: new Date().toLocaleString()
    });
    localStorage.setItem("pendo_scores", JSON.stringify(allScores));
}
</script>
</body>
    </html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PĒÑDØ Academy - Login</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0056b3">
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
body{ background:#0056b3; display:flex; justify-content:center; align-items:center; height:100vh; }
.login-box{ background:white; padding:40px; border-radius:10px; width:90%; max-width:400px; box-shadow:0 0 20px rgba(0,0,0,.3); }
h1{ color:#0056b3; text-align:center; margin-bottom:20px; }
input, select{ width:100%; padding:12px; margin:10px 0; border:1px solid #ccc; border-radius:5px; font-size:16px; }
button{ width:100%; padding:14px; background:#0056b3; color:white; border:none; border-radius:5px; font-size:18px; font-weight:bold; cursor:pointer; margin-top:10px; }
button:hover{ background:#003d80; }
.note{ font-size:12px; color:#666; text-align:center; margin-top:15px; }
</style>
</head>
<body>

<div class="login-box">
<h1>PĒÑDØ Academy</h1>
<input type="text" id="name" placeholder="Full Name">
<input type="email" id="email" placeholder="Email Address">
<select id="role">
    <option value="student">Student</option>
    <option value="admin">Admin</option>
</select>
<button onclick="login()">Login to Portal</button>
<p class="note">Demo Admin: admin@pendo.com | Demo Student: use any name + email</p>
</div>

<script>
function login(){
    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let role = document.getElementById("role").value;

    if(!name || !email){ alert("Please fill all fields"); return; }

    // Save session
    let user = { name: name, email: email, role: role };
    localStorage.setItem("pendoUser", JSON.stringify(user));

    // Route based on role
    if(role === "admin"){
        window.location.href = "admin.html";
    } else {
        window.location.href = "dashboard.html";
    }
}
</script>
</body>
</html>

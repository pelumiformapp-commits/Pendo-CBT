<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PĒÑDØ Academy - Register</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f9ff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:350px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#0056b3;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    background:#0056b3;
    color:#fff;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#003d80;
}

p{
    text-align:center;
    margin-top:15px;
}

a{
    color:#0056b3;
    text-decoration:none;
}
</style>

</head>
<body>

<div class="container">

<h1>PĒÑDØ Academy</h1>
<h3 style="text-align:center;margin-bottom:15px;">Student Registration</h3>

<form id="registerForm">
    <input type="text" id="fullname" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email Address" required>
    <input type="password" id="password" placeholder="Password" required>
    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
    <button type="submit">Create Account</button>
</form>

<p>Already have an account? 
    <a href="login.html">Login</a>
</p>

</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let fullname = document.getElementById("fullname").value.trim();
    let email = document.getElementById("email").value.trim().toLowerCase();
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    // 1. Password Matching Validation
    if(password !== confirmPassword){
        alert("Passwords do not match.");
        return;
    }

    // 2. Fetch Existing Global Users Array
    let registeredUsers = JSON.parse(localStorage.getItem("pendoUsers")) || [];

    // 3. Prevent Admin Email or Duplicate Student Email Theft
    if (email === "admin@pendo.com") {
        alert("This email address is reserved for administrative use.");
        return;
    }

    let emailExists = registeredUsers.some(user => user.email === email);
    if (emailExists) {
        alert("An account with this email address already exists.");
        return;
    }

    // 4. Create New Account Structure (Keyed as 'name' to align with login script)
    let newUser = {
        name: fullname,
        email: email,
        password: password
    };

    // 5. Append and Save to localStorage
    registeredUsers.push(newUser);
    localStorage.setItem("pendoUsers", JSON.stringify(registeredUsers));

    alert("Registration Successful! You can now log in.");
    window.location.href = "login.html";
});
</script>

</body>
</html>

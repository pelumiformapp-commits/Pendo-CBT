<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PĒÑDØ Academy - Dashboard</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0056b3">
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
body{ background:#f4f9ff; }
header{ background:#0056b3; color:white; padding:20px; text-align:center; }
.container{ max-width:1000px; margin:30px auto; padding:20px; }
.card{ background:white; padding:20px; margin-bottom:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,.15); }
button{ background:#0056b3; color:white; border:none; padding:12px 20px; border-radius:5px; cursor:pointer; font-size:16px; margin-top:10px; font-weight: bold; }
button:hover{ background:#003d80; }
.logout{ background:#dc3545; display: block; width: 100%; max-width: 200px; margin: 20px 0; }
.logout:hover{ background:#b02a37; }
.exam-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.exam-card { border-left: 5px solid #0056b3; }
.jamb { border-left-color: #28a745; }
.waec { border-left-color: #ffc107; }
.postutme { border-left-color: #dc3545; }
.history-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
.history-table th, .history-table td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
.history-table th { background-color: #0056b3; color: white; }
.no-history { color: #666; font-style: italic; margin-top: 10px; }
.badge { padding: 3px 10px; border-radius: 20px; font-size: 12px; color: white; }
</style>
</head>
<body>

<header>
<h1>PĒÑDØ Academy CBT Dashboard</h1>
</header>

<div class="container">

<div class="card">
<h2 id="welcomeText">Welcome Student</h2>
<p>Select your Examination below</p>
</div>

<!-- Available Exams -->
<div class="card">
<h3>Available Examinations <span class="badge" style="background:#28a745" id="examCount">0</span></h3>
<div id="examsList" class="exam-grid">
    <p>Loading exams...</p>
</div>
</div>

<!-- History -->
<div class="card">
<h2>Your Exam History</h2>
<div id="historyContainer"></div>
</div>

<button class="logout" onclick="logout()">Logout</button>

</div>

<script>
const userSession = JSON.parse(localStorage.getItem("pendoUser"));

if (!userSession || userSession.role !== "student") {
    window.location.href = "login.html";
} else {
    document.getElementById("welcomeText").innerText = `Welcome, ${userSession.name}`;
}

// Load Available Exams by Subject from Admin
function loadExams() {
    const allQuestions = JSON.parse(localStorage.getItem("pendo_global_exam")) || [];
    const examListDiv = document.getElementById("examsList");
    const examCountSpan = document.getElementById("examCount");

    if(allQuestions.length === 0) {
        examListDiv.innerHTML = `<p style="color:gray;">No exams available yet. Admin needs to add questions.</p>`;
        examCountSpan.innerText = 0;
        return;
    }

    // Group questions by Subject
    const subjects = {};
    allQuestions.forEach(q => {
        if(!subjects[q.subject]) subjects[q.subject] = [];
        subjects[q.subject].push(q);
    });

    examCountSpan.innerText = Object.keys(subjects).length;
    examListDiv.innerHTML = "";

    Object.keys(subjects).forEach(subject => {
        let examType = "jamb"; // default
        if(subject.toLowerCase().includes("waec")) examType = "waec";
        if(subject.toLowerCase().includes("post")) examType = "postutme";
        
        examListDiv.innerHTML += `
            <div class="card exam-card ${examType}">
                <h3>${subject}</h3>
                <p><b>${subjects[subject].length} Questions</b> | 40 Minutes</p>
                <p>JAMB/UTME/WAEC Standard</p>
                <button onclick="startExam('${subject}')">Start Exam</button>
            </div>
        `;
    });
}

function startExam(subject){
    localStorage.setItem("currentSubject", subject);
    window.location.href = `exam.html?subject=${encodeURIComponent(subject)}`;
}

function loadScoreHistory() {
    const container = document.getElementById("historyContainer");
    const allScores = JSON.parse(localStorage.getItem("pendo_scores")) || [];
    const studentHistory = allScores.filter(record => record.studentEmail === userSession.email);

    if (studentHistory.length === 0) {
        container.innerHTML = `<p class="no-history">You haven't taken any exams yet.</p>`;
        return;
    }

    let htmlTable = `<table class="history-table"><thead><tr><th>Date</th><th>Subject</th><th>Score</th></tr></thead><tbody>`;
    studentHistory.reverse().forEach(item => {
        htmlTable += `<tr><td>${item.date}</td><td><strong>${item.subject}</strong></td><td style="color: #28a745; font-weight: bold;">${item.score}</td></tr>`;
    });
    htmlTable += `</tbody></table>`;
    container.innerHTML = htmlTable;
}

function logout(){
    localStorage.removeItem("pendoUser");
    window.location.href = "login.html";
}

loadExams();
loadScoreHistory();
</script>
</body>
</html>
